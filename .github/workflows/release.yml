name: Release

# Pushing a tag like v2026.11.0 builds the production image and
# pushes it to ghcr.io/<owner>/<repo>:v2026.11.0
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Match your Hetzner server's CPU (run `uname -m` on it):
    #   aarch64 (ARM, e.g. CAX)  -> ubuntu-24.04-arm + linux/arm64
    #   x86_64  (Intel/AMD)      -> ubuntu-latest    + linux/amd64
    runs-on: ubuntu-latest
    env:
      PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@v5

      - name: Image name (GHCR needs lowercase)
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "PACKAGE=${REPO,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # One package version per release keeps cleanup below safe
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Keep only the 5 newest images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.PACKAGE }}
          package-type: container
          min-versions-to-keep: 5
