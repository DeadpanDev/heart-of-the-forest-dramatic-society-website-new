name: Release

# Pushing a tag like v2026.11.0 builds the production image and
# pushes it to ghcr.io/<owner>/<repo>:v2026.11.0
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Match your Hetzner server's CPU (run `uname -m` on it):
    #   aarch64 (ARM, e.g. CAX)  -> ubuntu-24.04-arm + linux/arm64
    #   x86_64  (Intel/AMD)      -> ubuntu-latest    + linux/amd64
    runs-on: ubuntu-latest
    # The Dokploy secrets live in this GitHub environment
    environment:
      name: DOKPLOY
    env:
      PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@v5

      - name: Image name (GHCR needs lowercase)
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "PACKAGE=${REPO,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # One package version per release keeps cleanup below safe
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          # No build cache: GitHub caches are scoped per tag, so a release
          # can never reuse the previous release's cache, and saving one
          # took ~2 minutes per run for no benefit.

      # Points the Dokploy app at the new tag, then deploys it.
      # Needs secrets DOKPLOY_URL, DOKPLOY_API_KEY and DOKPLOY_APPLICATION_ID
      # in the DOKPLOY environment. Skipped if DOKPLOY_URL is not set.
      # GHCR_USERNAME / GHCR_PULL_TOKEN are only needed if the package is private.
      - name: Deploy to Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$DOKPLOY_URL" ]; then
            echo "::notice::DOKPLOY_URL not set, skipping deploy. Set ${IMAGE}:${TAG} in Dokploy by hand."
            exit 0
          fi
          api="${DOKPLOY_URL%/}/api"

          if [ -n "$GHCR_PULL_TOKEN" ]; then
            provider=$(jq -n --arg id "$DOKPLOY_APPLICATION_ID" --arg img "${IMAGE}:${TAG}" \
              --arg user "$GHCR_USERNAME" --arg pass "$GHCR_PULL_TOKEN" \
              '{applicationId: $id, dockerImage: $img, registryUrl: "ghcr.io", username: $user, password: $pass}')
          else
            provider=$(jq -n --arg id "$DOKPLOY_APPLICATION_ID" --arg img "${IMAGE}:${TAG}" \
              '{applicationId: $id, dockerImage: $img, registryUrl: null, username: null, password: null}')
          fi

          echo "Setting image to ${IMAGE}:${TAG}"
          curl -sS --fail-with-body -X POST "$api/application.saveDockerProvider" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H "Content-Type: application/json" \
            -d "$provider"

          echo "Deploying"
          curl -sS --fail-with-body -X POST "$api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H "Content-Type: application/json" \
            -d "$(jq -n --arg id "$DOKPLOY_APPLICATION_ID" --arg t "Release $TAG" \
              '{applicationId: $id, title: $t}')"

      # Uses the gh CLI (preinstalled on runners) because
      # actions/delete-package-versions has no Node 24 release.
      - name: Keep only the 5 newest images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          KEEP: 5
        run: |
          base="/users/${OWNER}/packages/container/${PACKAGE}/versions"
          gh api --paginate "${base}?per_page=100" --jq '.[] | "\(.created_at) \(.id)"' \
            | sort -r \
            | tail -n +$((KEEP + 1)) \
            | while read -r created id; do
                echo "Deleting image version ${id} (created ${created})"
                gh api -X DELETE "${base}/${id}"
              done
